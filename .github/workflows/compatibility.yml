name: Desktop compatibility

on:
  push:
    # Feature branches are checked through pull_request; release tags through
    # release.yml's workflow_call. Avoid running the full matrix twice for each.
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_ref:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # Keep release callers separate from ordinary CI. Only superseded PR runs
  # may be canceled; main, manual, and exact-commit release checks must finish.
  group: desktop-compatibility-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.os }} / Node 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.release_ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Install the verified Codex CLI for signed-out localhost probes
        run: npm install --global @openai/codex@0.162.1
      - run: npm run test:bridge
      - run: npm run build:release
      - run: npm run test:release
      - name: Install Chromium for the isolated extension sidebar checks
        run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: node scripts/smoke-page-inspection.mjs
      - run: node scripts/smoke-extension-updates.mjs

  memory-runtime:
    name: Memory / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.release_ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: node scripts/smoke-memory.mjs

  reviewer-compatibility:
    name: Reviewer / ${{ matrix.os }} / Codex ${{ matrix.codex }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        codex: [0.164.0, 0.165.0, 0.169.0]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.release_ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --global @openai/codex@${{ matrix.codex }}
      - run: node scripts/probe-auto-review.mjs
