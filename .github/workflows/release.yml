name: Publish browser release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag (vX.Y.Z); unused for dry run
        required: false
        type: string
      dry_run:
        description: Read Store status only; do not upload or publish anything
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: chrome-web-store-release
  cancel-in-progress: false

jobs:
  status:
    if: github.repository == '07rjain/browser-control' && github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: chrome-web-store
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore.readonly
          create_credentials_file: false
      - name: Read Store status without changing any release
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: node scripts/publish-chrome-store.mjs

  preflight:
    if: github.repository == '07rjain/browser-control' && ((github.event_name == 'workflow_dispatch' && !inputs.dry_run) || (github.event_name == 'release' && vars.CWS_RELEASES_ENABLED == 'true'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - id: tag
        name: Verify tag, stable release, versions, and main ancestry
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/prepare-github-release.mjs check
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  compatibility:
    needs: preflight
    uses: ./.github/workflows/compatibility.yml
    with:
      release_ref: ${{ needs.preflight.outputs.commit }}

  publish:
    needs: [preflight, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: chrome-web-store
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run build:release
      - run: npm run test:release
      - name: Preserve exact source release assets (never overwrite)
        if: github.event_name == 'release' || !inputs.dry_run
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-github-release.mjs assets
      - name: Publish matching companion first
        if: github.event_name == 'release' || !inputs.dry_run
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          GH_TOKEN: ${{ secrets.COMPANION_RELEASE_TOKEN }}
        run: node scripts/prepare-github-release.mjs companion
      - name: Get short-lived Google token
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
      - name: Upload and submit for review, publish automatically after approval
        if: github.event_name == 'release' || !inputs.dry_run
        env:
          CWS_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: node scripts/publish-chrome-store.mjs --submit
